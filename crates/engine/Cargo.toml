[package]
name = "nds-engine"
version.workspace = true
edition.workspace = true
description = "Moteur de jeux DS natifs (Bevy) : deux ecrans 256x192, fenetres liees ou separees, entrees DS, specification par jeu"

[dependencies]
# wav : jouer les sons des jeux (fenetre Assets)
bevy = { workspace = true, features = ["wav", "system_clipboard"] }
encoding_rs = "0.8"
nds-nitro = { path = "../nitro" }
nds-video = { path = "../video" }
serde = { version = "1", features = ["derive"] }
toml = "1.1"
serde_json = "1"
dirs = "5"
# Meme version que bevy_winit : positionner la fenetre du bas directement
winit = { version = "0.30", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
