[package]
name = "nds-game-studio-installer"
version = "0.1.0"
edition = "2021"

[dependencies]
ndsgs-common = { path = "../common" }
ureq = { version = "3", features = ["native-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
dirs = "5"

[target.'cfg(windows)'.dependencies]
mslnk = "0.1"
native-windows-gui = "1.0"
native-windows-derive = "1.0"

[target."cfg(not(windows))".dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }

[build-dependencies]
embed-resource = "2"
