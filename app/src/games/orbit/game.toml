id = "orbit"
name = "Orbite 3D"
genre = "Demo 3D"
description = "Ecran du haut en 3D (avec texte 2D par-dessus), ecran du bas tactile : glissez le stylet pour tourner, L/R pour zoomer. Les ecrans fusionnes ont un ecart, comme sur la console."

[screens]
main = "top"
main_mode = "3d"
sub_mode = "2d"
gap = 16
main_clear = "#050510"
sub_clear = "#22223b"

[input]
touch = true

[timing]
fps = 60
